[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "principles-of-autonomy"
version = "0.1.0"
description = "Course tooling for 16.410 Principles of Autonomy"
requires-python = ">=3.10"
dependencies = [
    "gradescope-utils>=0.5.0",
    "timeout-decorator>=0.5.0",
    "numpy>=2.1.0",
    "nbformat>=5.10.4",
    "shapely>=2.1.0",
]

[tool.setuptools.packages.find]
include = ["principles_of_autonomy*"]
